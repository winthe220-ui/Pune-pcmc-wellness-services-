<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pune Wellness</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f2f8f6;
 color:#123f38;
}

header{
 background:#087b68;
 color:white;
 padding:20px 16px;
}

.container{
 max-width:1000px;
 margin:auto;
 padding:16px;
}

header h1{
 margin:0;
 font-size:28px;
}

header p{
 margin:7px 0 0;
 opacity:.9;
}

.hero{
 background:linear-gradient(135deg,#087b68,#61c4b0);
 color:white;
 border-radius:22px;
 padding:30px 22px;
 margin-bottom:22px;
}

.hero h2{
 margin:0 0 10px;
 font-size:34px;
}

.hero p{
 margin:0;
 font-size:17px;
}

.section{
 font-size:27px;
 margin:24px 0 14px;
}

.search{
 width:100%;
 padding:16px;
 border:1px solid #d7e2df;
 border-radius:15px;
 background:white;
 margin-bottom:15px;
 font-size:16px;
 outline:none;
}

.grid,
.staff-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:14px;
}

.area{
 background:white;
 border:1px solid #dce8e5;
 border-radius:18px;
 padding:18px;
 cursor:pointer;
 box-shadow:0 3px 12px #0000000b;
 transition:.2s;
}

.area:hover{
 transform:translateY(-2px);
}

.area b{

 font-size:20px;
}

.area span{
 display:block;
 color:#71817c;
 margin-top:7px;
}

.card{
 background:white;
 border-radius:20px;
 overflow:hidden;
 border:1px solid #dce8e5;
 box-shadow:0 4px 16px #00000010;
}

.photo{
 height:330px;
 background:linear-gradient(135deg,#0b7666,#9ed8cd);
 display:flex;
 align-items:center;
 justify-content:center;
 color:white;
 font-size:58px;
 font-weight:700;
 position:relative;
 overflow:hidden;
}

.photo img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
}

.card-body{
 padding:18px;
}

.badge{
 display:inline-block;
 background:#087b68;
 color:white;
 border-radius:10px;
 padding:7px 11px;
 font-size:13px;
 font-weight:700;
}

.card h3{
 font-size:25px;
 margin:12px 0 7px;
}

.meta{
 color:#687a75;
 margin:6px 0;
}

.description{
 line-height:1.5;
}

.prices{
 background:#eef8f5;
 border-radius:15px;
 padding:14px;
 margin-top:15px;
}

.price{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:9px 0;
 gap:10px;
}

.price strong{
 white-space:nowrap;
 font-size:17px;
}

.book{
 width:100%;
 border:0;
 background:#087b68;
 color:white;
 padding:15px;
 border-radius:14px;
 margin-top:14px;
 cursor:pointer;
 font-weight:700;
 font-size:16px;
}

.back{
 display:inline-block;
 margin:8px 0 16px;
 color:#087b68;
 font-weight:700;
 cursor:pointer;
}

.hidden{
 display:none!important;
}

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 z-index:100;
}

.modal-box{
 background:white;
 border-radius:20px;
 padding:22px;
 max-width:430px;
 width:100%;
}

.close{
 float:right;
 border:0;
 background:#eee;
 border-radius:10px;
 padding:7px 10px;
 cursor:pointer;
}

.note{
 font-size:13px;
 color:#71817c;
 line-height:1.5;
}

.booking-info{
 background:#eef8f5;
 padding:14px;
 border-radius:14px;
 margin:15px 0;
}

@media(max-width:650px){
 .grid,
 .staff-grid{
   grid-template-columns:1fr;
 }

 .hero h2{
   font-size:30px;
 }

 .photo{
   height:350px;
 }
}
</style>
</head>

/* =========================================================
   DATA GENERATION
========================================================= */

let selectedArea = null;

function money(n){
 return "₹" + n.toLocaleString("en-IN");
}

function generateStaff(){

 const all=[];
 let globalIndex=0;

 areas.forEach(area=>{

   const [areaName,prefix,count]=area;

   for(let i=1;i<=count;i++){

     const name=names[globalIndex % names.length];

     const seed=
       (globalIndex+1)*17+
       prefix.charCodeAt(0)*11+
       i*7;

     const age=20+(seed%7);

     /*
       Fixed realistic price range.
       No random huge prices.
    */

     const price1hr=799 + ((seed*13)%201);

     const price2hr=1399 + ((seed*17)%301);

     const priceNight=2499 + ((seed*19)%1001);

     /*
       IMPORTANT:
       Photos are assigned sequentially from the
       uploaded photo list.
    */

     const photoIndex=
       globalIndex % photoFiles.length;

     const photo=
       "photos/" + photoFiles[photoIndex];

     all.push({

       id:
         prefix+"-"+String(i).padStart(2,"0"),

       name:name,

       age:age,

       area:areaName,

       prefix:prefix,

       price1hr:price1hr,

       price2hr:price2hr,

       priceNight:priceNight,

       photo:photo

     });

     globalIndex++;

   }

 });

 return all;
}

const staffData=generateStaff();


/* =========================================================
   AREAS
========================================================= */

function renderAreas(list=areas){

 document.getElementById("areas").innerHTML=

 list.map(a=>`

 <div
   class="area"
   onclick="openArea('${a[1]}')"
 >

   <b>📍 ${a[0]}</b>

   <span>
     ${a[2]} available profiles
   </span>

 </div>

 `).join("");

}


/* =========================================================
   AREA SEARCH
========================================================= */

function searchAreas(){

 const q=
   document
   .getElementById("areaSearch")
   .value
   .toLowerCase()
   .trim();

 const list=
   areas.filter(a=>
     a[0]
     .toLowerCase()
     .includes(q)
   );

 renderAreas(list);
}


/* =========================================================
   OPEN AREA
========================================================= */

function openArea(prefix){

 selectedArea=
   areas.find(a=>a[1]===prefix);

 document
   .getElementById("home")
   .classList
   .add("hidden");

 document
   .getElementById("staffSection")
   .classList
   .remove("hidden");

 document
   .getElementById("staffTitle")
   .textContent=
   "📍 "+
   selectedArea[0]+
   " — Wellness Profiles";

 document
   .getElementById("staffSearch")
   .value="";

 renderStaff();

 window.scrollTo(0,0);
}

========================================================= */

function renderStaff(){

 if(!selectedArea)return;

 const q=
   document
   .getElementById("staffSearch")
   .value
   .toLowerCase()
   .trim();

 const list=
   staffData.filter(s=>
     s.prefix===selectedArea[1] &&
     (
       s.name
       .toLowerCase()
       .includes(q)
       ||
       s.id
       .toLowerCase()
       .includes(q)
     )
   );


 document.getElementById("staff").innerHTML=

 list.map(s=>`

 <article class="card">

   <div class="photo">

     <img
       src="${s.photo}"
       alt="${s.name}"
       loading="lazy"
       onerror="this.style.display='none';this.parentElement.innerHTML='<span>${s.name.charAt(0)}</span>'"
     >

   </div>


   <div class="card-body">

     <span class="badge">
       ${s.id}
     </span>

     <h3>
       ${s.name}
     </h3>

     <div class="meta">
       Age: ${s.age}
     </div>

     <div class="meta">
       📍 ${s.area}
     </div>

     <p class="description">
       Professional wellness specialist available
       for appointment-based services.
     </p>


     <div class="prices">

       <div class="price">
         <span>1 Hour Wellness</span>
         <strong>${money(s.price1hr)}</strong>
       </div>

       <div class="price">
         <span>2 Hour Wellness</span>
         <strong>${money(s.price2hr)}</strong>
       </div>

       <div class="price">
         <span>Full Night</span>
         <strong>${money(s.priceNight)}</strong>
       </div>

     </div>


     <button
       class="book"
       onclick="book('${s.name}','${s.id}')"
     >
       📅 Book Appointment
     </button>

   </div>

 </article>

 `).join("")

 ||

 "<p>No profiles found.</p>";

}

function goHome(){

 document
   .getElementById("staffSection")
   .classList
   .add("hidden");

 document
   .getElementById("home")
   .classList
   .remove("hidden");

 window.scrollTo(0,0);
}


/* =========================================================
   BOOKING
========================================================= */

function book(name,id){

 document
   .getElementById("modalText")
   .textContent=
   "Booking selected for "+
   name+
   " ("+
   id+
   ").";

 document
   .getElementById("modal")
   .classList
   .remove("hidden");

}


function closeModal(){

 document
   .getElementById("modal")
   .classList
   .add("hidden");

}
